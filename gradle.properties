# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# Minecraft 26.1+ ships unobfuscated, so no mappings dependency is needed at all.
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18.2

# Mod Properties
# The mod version lives in build.gradle: <number>-<stage>, stages go
# paper > draft > proof > review > gold.
group=io.github.stomarver

# Dependencies
fabric_api_version=0.162.0+26.3
# MidnightLib provides MidnightConfig. It is bundled into the jar (jar-in-jar), see build.gradle.
midnightlib_version=1.9.3+26.3-fabric
