plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

// Mod version: <number>-<stage>, stages go paper > draft > proof > review > gold.
version = "2-draft"
group = project.group

base {
	archivesName = "aawt"
}

// Release file name: aawt_2-draft+263.jar - the mod id, the version and the Minecraft
// version without its dots.
def mcTag = project.minecraft_version.toString().replace('.', '')
def aawtJarName = "${project.base.archivesName.get()}_${project.version}+${mcTag}.jar"

repositories {
	// MidnightLib (MidnightConfig) is published on Modrinth's maven.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	// src/main = common code, src/client = client-only code.
	splitEnvironmentSourceSets()

	mods {
		"aawt" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Minecraft 26.1+ is distributed unobfuscated: there is no `mappings` dependency any more,
	// the game jar already carries the official (Mojang) names.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. Not used by this mod directly, but required at runtime:
	// MidnightLib depends on fabric-resource-loader-v0, which ships with Fabric API.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MidnightConfig (part of MidnightLib): on the compile classpath, and bundled
	// into the built jar as a jar-in-jar through the `include` configuration below.
	implementation "maven.modrinth:midnightlib:${project.midnightlib_version}"
	include "maven.modrinth:midnightlib:${project.midnightlib_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The jar that ships. With unobfuscated Minecraft there is no separate remapJar step any more:
// loom feeds the jar-in-jar entries (the bundled MidnightLib) straight into this task, so its
// output is already the file a player downloads - aawt_2-draft+263.jar.
tasks.named('jar') {
	def projectName = project.name
	inputs.property "projectName", projectName

	archiveFileName.set(aawtJarName)

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
	}
}
